title: Hradební programování
description: Online učebnice programování (C#, OOP, WinForms)
lang: cs
baseurl: "/hradebni-pgm"
url: "https://dawissl.github.io"
remote_theme: jasongrimes/jekyll-chapterbook

# =========================
# COLLECTIONS
# =========================
collections:
  docs:
    output: true
    sort_by: order

ordered_collections:
  - docs

# =========================
# PLUGINS
# =========================
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# =========================
# MARKDOWN + SYNTAX HIGHLIGHT
# =========================
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    guess_lang: true
    span:
      line_numbers: false
    block:
      line_numbers: false

# =========================
# SITE SETTINGS
# =========================
timezone: Europe/Prague
permalink: pretty

# =========================
# SEO / SOCIAL
# =========================
author: Dawis
twitter:
  username: ""
social:
  name: Hradební programování
  links:
    - https://github.com/dawissl/hradebni-pgm

# =========================
# TOC (in-page obsah)
# =========================
toc:
  enabled: true
  h_min: 1
  h_max: 3

# =========================
# BUILD EXCLUDES
# =========================
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# =========================
# FEED CONFIG
# =========================
feed:
  path: feed.xml
